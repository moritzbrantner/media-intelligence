services:
  mock-service:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "ops.scripts.mock_service"]
    environment:
      PYTHONPATH: /workspace
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8080
    ports:
      - "${MOCK_SERVICE_PORT:-8080}:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/raw-media &&
      mc mb --ignore-existing local/processed &&
      mc mb --ignore-existing local/frames

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.12.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mock-ingestion:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_discovery.ingestion.main"]
    environment:
      PYTHONPATH: /workspace/projects/discovery/src:/workspace/contracts/src
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8081
      SERVICE_NAME: mock-ingestion
      MOCK_SOURCE: ingestion
    ports:
      - "${MOCK_INGESTION_PORT:-8081}:8081"

  mock-transcription:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_extraction.transcription.mock_service"]
    environment:
      PYTHONPATH: /workspace/projects/extraction/src
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8082
      SERVICE_NAME: mock-transcription
      MOCK_SOURCE: transcription
    ports:
      - "${MOCK_TRANSCRIPTION_PORT:-8082}:8082"

  mock-ocr:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_extraction.ocr.main"]
    environment:
      PYTHONPATH: /workspace/projects/extraction/src
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8083
      SERVICE_NAME: mock-ocr
      MOCK_SOURCE: ocr
    ports:
      - "${MOCK_OCR_PORT:-8083}:8083"

  mock-enrichment:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_understanding.enrichment.main"]
    environment:
      PYTHONPATH: /workspace/projects/understanding/src:/workspace/contracts/src
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8084
      SERVICE_NAME: mock-enrichment
      MOCK_SOURCE: enrichment
    ports:
      - "${MOCK_ENRICHMENT_PORT:-8084}:8084"

  mock-profiling:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_understanding.profiling.main"]
    environment:
      PYTHONPATH: /workspace/projects/understanding/src:/workspace/contracts/src
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8085
      SERVICE_NAME: mock-profiling
      MOCK_SOURCE: profiling
    ports:
      - "${MOCK_PROFILING_PORT:-8085}:8085"

  mock-indexer:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "ops.scripts.mock_service"]
    environment:
      PYTHONPATH: /workspace
      MOCK_SERVICE_HOST: 0.0.0.0
      MOCK_SERVICE_PORT: 8086
      SERVICE_NAME: mock-indexer
      MOCK_SOURCE: indexer
    ports:
      - "${MOCK_INDEXER_PORT:-8086}:8086"

  source-watcher:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_discovery.source_watcher.main"]
    environment:
      PYTHONPATH: /workspace/projects/discovery/src:/workspace/contracts/src
      SOURCE_WATCHER_HOST: 0.0.0.0
      SOURCE_WATCHER_PORT: 8087
    ports:
      - "${MOCK_SOURCE_WATCHER_PORT:-8087}:8087"

  search:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "mi_search.main"]
    environment:
      PYTHONPATH: /workspace/projects/search/src:/workspace/contracts/src
      SEARCH_SERVICE_HOST: 0.0.0.0
      SEARCH_SERVICE_PORT: 8088
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${SEARCH_SERVICE_PORT:-8088}:8088"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
  minio_data:
