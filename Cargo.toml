[workspace]
members = ["crates/media-intelligence-core", "crates/media-intelligence-analysis"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/media-intelligence"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
# Neutral Foundation contracts, pinned to an exact public revision (owner rule 2026-10-10:
# exact-rev git dependencies, no crates.io publishes, no path dependencies).
moenarch-corpus-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "b8a8daed4f98fff7194ec5f2debdd75d30b58c5a" }
moenarch-media-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "b8a8daed4f98fff7194ec5f2debdd75d30b58c5a" }
# Canonical scene producer (#27): visual-analysis at an exact public revision. Detection
# itself is scenedetect-core, reached only through these crates.
video-analysis-ffmpeg = { package = "moenarch-video-analysis-ffmpeg", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
video-analysis-ingest = { package = "moenarch-video-analysis-ingest", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
tempfile = "3.23.0"
# Visible-text producer (#33): visual-analysis OCR backends, the scene-aware OCR sampling
# path (video-analysis-ingest feature `ocr`) and text tracking, all at the scene producer's
# revision. Only `media-intelligence-analysis`'s opt-in `visual-analysis-ocr` feature uses them.
image-analysis-core = { package = "moenarch-image-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
video-analysis-core = { package = "moenarch-video-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
video-analysis-recognition = { package = "moenarch-video-analysis-recognition", git = "https://github.com/moritzbrantner/visual-analysis", rev = "a5d6c6f765ce7dac569fd190c7f9a75ae54cc776" }
num-rational = "0.4.2"
# Canonical speech producer (#32): audio-analysis transcription at an exact public revision.
# Only `media-intelligence-analysis`'s opt-in `audio-analysis` feature uses it. ASR,
# model resolution and decoding stay inside audio-analysis.
audio-analysis-transcription = { package = "moenarch-audio-analysis-transcription", git = "https://github.com/moritzbrantner/audio-analysis", rev = "1971127e352078479b3bacece8d1f8dba19dd575", default-features = false }

# visual-analysis (115c1f0, now 35a5320) declares registry requirements on Foundation crates (its own
# source-deps file names foundation b7533cd). These patches resolve them to the one
# Foundation revision this workspace already pins (d5c0d8f, a descendant of b7533cd with
# identical crate versions), so the graph holds a single copy of each Foundation crate.
# audio-analysis cc8075f (#32) declares exact registry requirements (`=x.y.z`) on Foundation
# crates; its source-deps file names foundation fb51ab4, an ancestor of d5c0d8f with
# identical versions of every crate patched here.
[patch.crates-io]
moenarch-audio-contracts = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-corpus-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-math-geometry-2d = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-math-signal-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-media-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-model-runtime = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-runtime-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-tensor-data = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-runtime-onnx = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-semantic-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-math-linear = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
moenarch-vector-analysis-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "d5c0d8ff8989cde41e7754deba78d4f6493d60f6" }
