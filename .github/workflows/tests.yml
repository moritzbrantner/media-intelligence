name: Tests

on:
  push:
  pull_request:

jobs:
  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workdir:
          - contracts
          - projects/discovery
          - projects/extraction
          - projects/search
          - projects/understanding
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: python -m pytest -q

  cross-project-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run repository test suite
        run: python -m pytest -q

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ffmpeg (real scene-producer tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked 2>&1 | tee test.log

      - name: Lint and test the audio-analysis speech adapter feature
        run: |
          cargo clippy --locked -p media-intelligence-analysis --all-targets --features audio-analysis -- -D warnings
          cargo test --locked -p media-intelligence-analysis --features audio-analysis

      - name: Lint and test the visual-analysis OCR adapter feature
        shell: bash
        run: |
          cargo clippy --locked -p media-intelligence-analysis --all-targets --features visual-analysis-ocr -- -D warnings
          cargo test --locked -p media-intelligence-analysis --features visual-analysis-ocr 2>&1 | tee -a test.log

      - name: Require real scene-producer execution
        run: "! grep -q SKIPPED test.log"

      - name: Run the composition example
        run: cargo run --locked -p media-intelligence-core --example compose -- crates/media-intelligence-core/tests/fixtures/lecture_composition.json > /dev/null
