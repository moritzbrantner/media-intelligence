[package]
name = "media-intelligence-analysis"
description = "Bounded native media-analysis operation: runs the canonical scene producer and caller-supplied speech/visible-text producers for one caller-owned media file and composes their evidence through media-intelligence-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "media_intelligence_analysis"

[dependencies]
media-intelligence-core = { path = "../media-intelligence-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
video-analysis-ffmpeg.workspace = true
video-analysis-ingest.workspace = true
audio-analysis-transcription = { workspace = true, optional = true }
image-analysis-ocr = { workspace = true, optional = true }
video-analysis-core = { workspace = true, optional = true }
video-analysis-recognition = { workspace = true, optional = true }
num-rational = { workspace = true, optional = true }

[features]
default = []
# Opt-in speech producer adapter (#32) over audio-analysis transcription. Without a further
# runtime feature, the adapter compiles, but the native Candle Whisper provider reports
# that the runtime is missing.
audio-analysis = ["dep:audio-analysis-transcription"]
# Real native Candle Whisper inference (heavy compile; not built by default CI or tests).
audio-analysis-candle = ["audio-analysis", "audio-analysis-transcription/candle"]
# Opt-in visible-text producer adapter (#33) over visual-analysis scene-aware OCR and text
# tracking. Without a further runtime feature, the ONNX TrOCR backend compiles but reports
# that its runtime is missing; the JSON external-command backend works.
visual-analysis-ocr = [
    "dep:image-analysis-ocr",
    "dep:video-analysis-core",
    "dep:video-analysis-recognition",
    "dep:num-rational",
    "video-analysis-ingest/ocr",
    "video-analysis-recognition/ocr",
]
# Real local ONNX TrOCR inference (onnxruntime + tokenizers; not built by default CI or tests).
visual-analysis-ocr-onnx = ["visual-analysis-ocr", "image-analysis-ocr/local-onnx"]

[dev-dependencies]
tempfile.workspace = true
num-rational.workspace = true
# Only to implement a fixture `OcrBackend` (its `ImageView` argument) in the #33 mapping test.
image-analysis-core.workspace = true
