name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cross-project-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run repository test suite
        run: python -m pytest -q

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install ffmpeg (real scene-producer tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked 2>&1 | tee test.log

      - name: Lint and test the audio-analysis speech adapter feature
        run: |
          cargo clippy --locked -p media-intelligence-analysis --all-targets --features audio-analysis -- -D warnings
          cargo test --locked -p media-intelligence-analysis --features audio-analysis

      - name: Lint and test the visual-analysis OCR adapter feature
        shell: bash
        run: |
          cargo clippy --locked -p media-intelligence-analysis --all-targets --features visual-analysis-ocr -- -D warnings
          cargo test --locked -p media-intelligence-analysis --features visual-analysis-ocr 2>&1 | tee -a test.log

      - name: Check clean downstream OCR consumer
        run: bash scripts/check-downstream-ocr-consumer.sh

      - name: Require real scene-producer execution
        run: "! grep -q SKIPPED test.log"

      - name: Run the composition example
        run: cargo run --locked -p media-intelligence-core --example compose -- crates/media-intelligence-core/tests/fixtures/lecture_composition.json > /dev/null

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["cross-project-contracts", "rust-core"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["cross-project-contracts", "rust-core"]'
