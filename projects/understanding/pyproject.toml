[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-understanding"
version = "0.1.0"
description = "Understanding bounded context for enrichment and profiling."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "sentence-transformers>=3.0,<4",
  "transformers>=5.19,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../contracts/src"]
testpaths = ["tests"]
markers = [
  "integration: integration coverage that exercises multiple components.",
  "elasticsearch: tests that require or emulate Elasticsearch behavior.",
  "model: tests that exercise heavyweight model-backed paths.",
]

