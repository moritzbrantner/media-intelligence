name: Tests

on:
  push:
  pull_request:

jobs:
  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workdir:
          - contracts
          - projects/discovery
          - projects/extraction
          - projects/search
          - projects/understanding
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: python -m pytest -q

  cross-project-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run repository test suite
        run: python -m pytest -q

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Run the composition example
        run: cargo run --locked -p media-intelligence-core --example compose -- crates/media-intelligence-core/tests/fixtures/lecture_composition.json > /dev/null
