name: Tests

on:
  push:
  pull_request:

jobs:
  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workdir:
          - contracts
          - projects/discovery
          - projects/extraction
          - projects/search
          - projects/understanding
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: python -m pytest -q

  cross-project-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic requests

      - name: Run repository test suite
        run: python -m pytest -q
