[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-contracts"
version = "0.1.0"
description = "Shared versioned contracts for media intelligence services."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: integration coverage that exercises multiple components.",
  "elasticsearch: tests that require or emulate Elasticsearch behavior.",
  "model: tests that exercise heavyweight model-backed paths.",
]

